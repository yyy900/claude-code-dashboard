<!doctype html>
<meta charset="utf-8">
<title>panel</title>
<style>
  :root {
    --bg: #F0EEE6;
    --surface: #FAF8F4;
    --card: #FFFFFF;
    --hover: #F5F0E4;
    --border: #E5DCC9;
    --border-strong: #D5C8AE;
    --text: #1A1814;
    --text-dim: #6B6055;
    --text-faint: #98897B;
    --accent: #C15F3C;
    --accent-soft: #F3D9C6;
    --ok: #6B8E3D;
    --ok-soft: #DDE7CB;
    --warn: #B88936;
    --warn-soft: #F2E2BE;
    --bad: #B54639;
    --bad-soft: #F0CFC8;
    --pending: #8B6FA8;
    --pending-soft: #E6DCEF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 14px/1.55 -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", system-ui, sans-serif;
         background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  code, pre, .mono { font: 12px/1.5 "SF Mono", ui-monospace, Menlo, monospace; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }

  nav { display: flex; align-items: center; gap: 2px; padding: 0 24px; background: var(--surface);
        border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  nav .brand { font-weight: 600; padding: 14px 18px 14px 0; letter-spacing: -0.01em; font-size: 15px; color: var(--text); }
  nav .brand .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: middle; }
  nav button { background: transparent; color: var(--text-dim); border: 0; padding: 14px 14px;
               cursor: pointer; border-bottom: 2px solid transparent; font: inherit; font-weight: 500;
               transition: color 0.15s; }
  nav button:hover { color: var(--text); }
  nav button.on { color: var(--accent); border-bottom-color: var(--accent); }

  main { padding: 22px 24px 80px; max-width: 1400px; margin: 0 auto; }

  h2 { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin: 24px 0 10px; }
  h3 { font-size: 15px; font-weight: 600; margin: 0; color: var(--text); }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .stat { color: var(--text-dim); font-size: 13px; }
  .stat b { color: var(--text); font-weight: 600; }
  .group-header { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 8px; }
  .group-header h2 { margin: 0; }
  .group-header .count { color: var(--text-faint); font-size: 12px; }
  .sub { color: var(--text-faint); font-size: 12px; }
  .banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px;
            padding: 10px 14px; margin-bottom: 16px; color: #5a2a18; font-size: 13px; }
  .banner b { color: #3d1d10; }

  /* chips */
  .chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 10px;
          background: var(--hover); color: var(--text-dim); font-size: 11px; font-weight: 500;
          line-height: 18px; white-space: nowrap; }
  .chip.kind   { background: var(--accent-soft); color: #8a3618; }
  .chip.ok     { background: var(--ok-soft); color: #3d5a20; }
  .chip.warn   { background: var(--warn-soft); color: #6a4d15; }
  .chip.bad    { background: var(--bad-soft); color: #6d2018; }
  .chip.pending{ background: var(--pending-soft); color: #4e3766; }

  /* buttons */
  .btn { background: var(--surface); color: var(--text); border: 1px solid var(--border);
         padding: 5px 11px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
         line-height: 18px; transition: background 0.1s, border-color 0.1s; }
  .btn:hover { background: var(--hover); border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
  .btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
  .btn.warn { color: var(--warn); border-color: var(--warn-soft); }
  .btn.bad  { color: var(--bad); border-color: var(--bad-soft); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
  .btn.ghost:hover { color: var(--text); background: var(--hover); }
  .btn-sm { padding: 2px 8px; font-size: 11px; }

  /* form */
  input, select, textarea { background: var(--card); color: var(--text); border: 1px solid var(--border);
                             padding: 6px 10px; border-radius: 6px; font: inherit; font-size: 13px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { width: 100%; min-height: 100px; font: 12.5px/1.55 "SF Mono", ui-monospace, Menlo, monospace; }
  .search { width: 280px; }

  /* card */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
          padding: 12px 14px; margin-bottom: 8px; transition: border-color 0.1s, transform 0.05s; }
  .card:hover { border-color: var(--border-strong); }
  .card.disabled { opacity: 0.6; background: var(--surface); }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .card-head .name { font-weight: 600; font-size: 14px; color: var(--text); }
  .card-head .spacer { flex: 1; }
  .card-desc { color: var(--text-dim); font-size: 13px; margin: 6px 0 0; line-height: 1.55;
               overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .card-actions { display: flex; gap: 4px; margin-top: 10px; align-items: center; }
  .card details { margin-top: 8px; }
  .card details summary { cursor: pointer; color: var(--text-faint); font-size: 11px; }
  .card details pre { margin-top: 6px; background: var(--surface); padding: 8px; border-radius: 4px;
                      overflow: auto; max-height: 240px; }

  /* toggle */
  .toggle { background: var(--border); border: 0; border-radius: 14px; padding: 0;
            width: 38px; height: 22px; position: relative; cursor: pointer; transition: background 0.15s; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
                   border-radius: 50%; background: #fff; transition: all 0.15s;
                   box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
  .toggle.on { background: var(--ok); }
  .toggle.on::after { left: 18px; }

  /* split */
  .split { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }

  /* session/list row */
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
         border: 1px solid var(--border); border-radius: 8px; background: var(--card);
         margin-bottom: 6px; cursor: pointer; transition: border-color 0.1s, background 0.1s; }
  .row:hover { border-color: var(--border-strong); background: var(--hover); }
  .row.selected { border-color: var(--accent); background: var(--accent-soft); }
  .row .id { color: var(--text-faint); width: 70px; font: 11px/1 "SF Mono", ui-monospace, Menlo, monospace;
             flex-shrink: 0; }
  .row .name { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .row .meta { color: var(--text-faint); font-size: 12px; flex-shrink: 0; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex-shrink: 0;
           box-shadow: 0 0 0 0 rgba(107,142,61,0.55); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(107,142,61,0.55); }
                     70% { box-shadow: 0 0 0 7px rgba(107,142,61,0); }
                     100% { box-shadow: 0 0 0 0 rgba(107,142,61,0); } }

  /* detail panel */
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
           padding: 14px; position: sticky; top: 64px; max-height: calc(100vh - 90px); overflow: auto; }
  .panel.empty { color: var(--text-faint); text-align: center; padding: 40px 10px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: 100px 1fr; gap: 4px 12px; font-size: 13px; margin: 8px 0; }
  .kv dt { color: var(--text-faint); }
  .kv dd { margin: 0; color: var(--text); word-break: break-all; }

  /* event/message timeline */
  .ev { display: grid; grid-template-columns: 70px auto 1fr auto; gap: 10px; align-items: baseline;
        padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .ev:last-child { border-bottom: 0; }
  .ev .t { color: var(--text-faint); font: 11px/1.5 "SF Mono", ui-monospace, Menlo, monospace; }
  .ev .body { color: var(--text); min-width: 0; overflow: hidden; word-wrap: break-word; }
  .ev .body b { font-weight: 500; }
  .ev .body .muted { color: var(--text-dim); }
  .ev .actions { display: flex; gap: 4px; }
  .ev details { margin-top: 4px; grid-column: 2 / -1; }
  .ev details summary { font-size: 11px; color: var(--text-faint); cursor: pointer; }
  .ev details pre { margin-top: 4px; background: var(--surface); padding: 6px; border-radius: 4px;
                    max-height: 240px; overflow: auto; }

  /* message (Claude session) */
  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; border: 1px solid transparent; }
  .msg.user { background: var(--accent-soft); border-color: #f0c8b3; }
  .msg.assistant { background: var(--surface); border-color: var(--border); }
  .msg.system { background: var(--hover); color: var(--text-dim); font-style: italic; }
  .msg.meta { color: var(--text-faint); font-size: 11px; padding: 4px 12px; }
  .msg .label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  .msg .text { white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; max-height: 360px; overflow: auto; }

  /* live feed */
  .feed { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
          padding: 4px 14px; }
  .feed-empty { color: var(--text-faint); padding: 30px; text-align: center; }

  /* settings */
  .setting { display: grid; grid-template-columns: 240px 1fr; gap: 14px; align-items: center;
             padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
             background: var(--card); margin-bottom: 6px; }
  .setting .key { font-weight: 500; font-size: 13px; }
  .setting .hint { color: var(--text-faint); font-size: 11px; margin-top: 2px; }
  .setting input { width: 100%; }

  /* memory editor */
  .mem-layout { display: grid; grid-template-columns: 280px 1fr; gap: 14px; }
  @media (max-width: 900px) { .mem-layout { grid-template-columns: 1fr; } }
  .mem-list { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
              max-height: calc(100vh - 130px); overflow: auto; }
  .mem-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px;
              cursor: pointer; font-size: 13px; }
  .mem-item:hover { background: var(--hover); }
  .mem-item.selected { background: var(--accent-soft); color: #6a2515; }
  .mem-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem-item .size { color: var(--text-faint); font-size: 11px; }
  .mem-editor { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .mem-editor textarea { min-height: calc(100vh - 230px); font-size: 13px; }
  .mem-editor.empty { color: var(--text-faint); text-align: center; padding: 60px 20px; }

  /* dialog */
  dialog { background: var(--card); color: var(--text); border: 1px solid var(--border);
           padding: 22px; border-radius: 10px; max-width: 660px; width: 90vw;
           box-shadow: 0 20px 60px rgba(60,40,20,0.15); }
  dialog::backdrop { background: rgba(40,30,20,0.32); backdrop-filter: blur(2px); }
  dialog h3 { margin-bottom: 12px; font-size: 15px; }
  dialog label { display: block; color: var(--text-dim); font-size: 12px; margin-bottom: 4px; margin-top: 10px; }
  dialog .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  .empty-state { color: var(--text-faint); padding: 16px 4px; font-size: 13px; text-align: center; }
</style>

<nav>
  <span class="brand"><span class="dot"></span>panel</span>
  <button data-tab="plugins" class="on">Plugins</button>
  <button data-tab="skills">Skills</button>
  <button data-tab="hooks">Hooks</button>
  <button data-tab="sessions">Sessions</button>
  <button data-tab="memory">Memory</button>
  <button data-tab="live">Live</button>
  <button data-tab="settings">Settings</button>
</nav>
<main></main>
<dialog id="dlg"></dialog>

<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const main = $('main');
const dlg = $('#dlg');
let cur = 'plugins';
let es;
const S = {
  searches: {plugin:'', skill:'', hook:''},
  enabledFilter: 'enabled',  // enabled | disabled | all
  selSession: null,
  selMemory: null,
};

document.querySelectorAll('nav button[data-tab]').forEach(b => b.onclick = () => {
  cur = b.dataset.tab;
  $$('nav button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

async function api(path, opts={}) {
  if (opts.body && typeof opts.body !== 'string') {
    opts.body = JSON.stringify(opts.body);
    opts.headers = {'Content-Type':'application/json', ...(opts.headers||{})};
  }
  const r = await fetch(path, opts);
  if (r.status === 204) return null;
  const t = r.headers.get('Content-Type') || '';
  return t.includes('json') ? r.json() : r.text();
}

function openDialog(html, onMount) {
  dlg.innerHTML = html;
  dlg.showModal();
  if (onMount) onMount();
  dlg.querySelectorAll('[data-close]').forEach(b => b.onclick = () => dlg.close());
}

const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtTime(s) { if (!s) return '—'; const d = new Date(s.includes('T')? s : s.replace(' ', 'T')+'Z'); return d.toTimeString().slice(0,8); }
function fmtRelative(s) {
  if (!s) return '—';
  const d = new Date(s.includes('T')? s : s.replace(' ', 'T')+'Z');
  const sec = (Date.now() - d.getTime()) / 1000;
  if (sec < 60) return `${Math.floor(sec)}s ago`;
  if (sec < 3600) return `${Math.floor(sec/60)}m ago`;
  if (sec < 86400) return `${Math.floor(sec/3600)}h ago`;
  if (sec < 604800) return `${Math.floor(sec/86400)}d ago`;
  return d.toISOString().slice(0,10);
}
function fmtBytes(n) { return n < 1024 ? `${n} B` : n < 1024*1024 ? `${(n/1024).toFixed(1)} KB` : `${(n/1024/1024).toFixed(1)} MB`; }

const statusChip = s => `<span class="chip ${({success:'ok', failed:'bad', timeout:'bad', cancelled:'bad', running:'pending', pending:'warn'})[s]||''}">${s}</span>`;
const levelChip  = l => l ? `<span class="chip ${({error:'bad', warn:'warn', info:'ok', debug:''})[l]||''}">${l}</span>` : '';
const kindChip   = k => `<span class="chip kind">${k}</span>`;

// ============ PLUGINS / SKILLS / HOOKS (entity tabs) ============
async function renderEntities(kind) {
  const rows = await api(`/api/entities?kind=${kind}`);
  const allEnts = await api('/api/entities');
  const idMap = Object.fromEntries(allEnts.map(r => [r.id, r]));

  const enabledCount = rows.filter(r => r.enabled).length;
  const disabledCount = rows.length - enabledCount;
  const search = S.searches[kind] || '';

  const labels = {plugin:'Plugins', skill:'Skills', hook:'Hooks'};
  const label = labels[kind] || kind;
  const lower = label.toLowerCase();
  const fchip = (val, txt) => {
    const on = S.enabledFilter === val;
    return `<button class="btn btn-sm ${on?'primary':''}" data-ef="${val}">${txt}</button>`;
  };

  main.innerHTML = `
    <div class="bar">
      <h2 style="margin:0">${label}</h2>
      <span class="count" style="color:var(--text-faint)">${rows.length}</span>
      <span style="width:8px"></span>
      <input id="search" class="search" placeholder="search ${lower}…" value="${escapeHtml(search)}">
      ${fchip('enabled', `Enabled (${enabledCount})`)}
      ${fchip('disabled', `Disabled (${disabledCount})`)}
      ${fchip('all', 'All')}
      <span style="flex:1"></span>
      <button class="btn" id="import-real">Import from ~/.claude</button>
      ${kind === 'plugin' ? `<button class="btn primary" id="install">+ Install plugin</button>` : ''}
      ${kind === 'hook' ? `<button class="btn primary" id="addhook">+ Add hook</button>` : ''}
    </div>
    <div id="body"></div>
  `;

  $('#search').oninput = e => { S.searches[kind] = e.target.value; renderEntList(rows, idMap, kind); };
  $$('[data-ef]').forEach(b => b.onclick = () => { S.enabledFilter = b.dataset.ef; renderEntities(kind); });
  $('#import-real').onclick = async () => {
    const r = await api('/api/import', {method:'POST'});
    openDialog(`<h3>Imported ${r.imported} real entities</h3>
      <p class="sub">Read from <code>~/.claude/plugins</code>, <code>~/.claude/skills</code>, and <code>~/.claude/settings.json</code>.</p>
      <div class="dlg-actions"><button class="btn primary" data-close>OK</button></div>`);
    renderEntities(kind);
  };
  if ($('#install')) $('#install').onclick = installPluginDialog;
  if ($('#addhook')) $('#addhook').onclick = addHookDialog;

  renderEntList(rows, idMap, kind);
}

function renderEntList(rows, idMap, kind) {
  const search = (S.searches[kind] || '').toLowerCase();
  const filtered = rows.filter(r => {
    if (S.enabledFilter === 'enabled'  && !r.enabled) return false;
    if (S.enabledFilter === 'disabled' &&  r.enabled) return false;
    if (search) {
      const cfg = (r.config || '').toLowerCase();
      if (!r.name.toLowerCase().includes(search) && !cfg.includes(search)) return false;
    }
    return true;
  });
  if (!filtered.length) {
    $('#body').innerHTML = `<div class="empty-state">Nothing matches the current filter.</div>`;
    return;
  }
  $('#body').innerHTML = filtered.map(e => renderCard(e, idMap)).join('');
  wireCardActions(rows);
}

function renderCard(e, idMap) {
  const cfg = JSON.parse(e.config || '{}');
  const parent = e.parent_id ? idMap[e.parent_id] : null;
  let desc = cfg.description || '';
  if (typeof desc !== 'string') desc = JSON.stringify(desc);
  desc = desc.replace(/\s+/g, ' ').trim();
  const meta = [];
  if (cfg.source) meta.push(`<span class="chip">${escapeHtml(cfg.source)}</span>`);
  if (cfg.version) meta.push(`<span class="chip">v${escapeHtml(cfg.version)}</span>`);
  if (cfg.risk) meta.push(`<span class="chip ${cfg.risk==='high'?'bad':cfg.risk==='medium'?'warn':''}">risk: ${escapeHtml(cfg.risk)}</span>`);
  if (parent) meta.push(`<span class="chip">in ${escapeHtml(parent.name)}</span>`);
  if (cfg.scope) meta.push(`<span class="chip">${escapeHtml(cfg.scope)}-scope</span>`);
  if (e.kind === 'hook' && cfg.event) meta.push(`<span class="chip kind">${escapeHtml(cfg.event)}${cfg.matcher && cfg.matcher !== '*' ? ':' + escapeHtml(cfg.matcher) : ''}</span>`);
  if (e.kind === 'hook' && cfg.mode) meta.push(`<span class="chip">${escapeHtml(cfg.mode)}</span>`);
  if (cfg.author) {
    const a = typeof cfg.author === 'string' ? cfg.author : cfg.author.name;
    if (a) meta.push(`<span class="chip">by ${escapeHtml(a)}</span>`);
  }
  for (const p of (cfg.permissions || [])) meta.push(`<span class="chip">${escapeHtml(p)}</span>`);

  return `<div class="card ${!e.enabled ? 'disabled' : ''}">
    <div class="card-head">
      <span class="name">${escapeHtml(e.name)}</span>
      ${kindChip(e.kind)}
      <span class="spacer"></span>
      <span class="sub">${e.enabled ? 'enabled' : 'disabled'}</span>
      <button class="toggle ${e.enabled?'on':''}" data-toggle="${e.id}" data-on="${e.enabled}" title="enable/disable"></button>
    </div>
    ${desc ? `<p class="card-desc">${escapeHtml(desc)}</p>` : ''}
    ${meta.length ? `<div class="card-meta">${meta.join('')}</div>` : ''}
    <div class="card-actions">
      ${e.kind === 'skill' ? `<button class="btn btn-sm" data-run="${e.id}">Test run</button>` : ''}
      <button class="btn btn-sm" data-hist="${e.id}">History</button>
      <button class="btn btn-sm" data-edit="${e.id}">Edit</button>
      <button class="btn btn-sm ghost bad" data-del="${e.id}">${e.kind==='plugin'?'Uninstall':'Remove'}</button>
      <details><summary>raw config</summary><pre class="mono">${escapeHtml(JSON.stringify(cfg, null, 2))}</pre></details>
    </div>
  </div>`;
}

function wireCardActions(rows) {
  $$('[data-toggle]').forEach(b => b.onclick = async () => {
    await api(`/api/entities/${b.dataset.toggle}`, {method:'PATCH', body:{enabled: b.dataset.on==='1'?0:1}});
    render();
  });
  $$('[data-run]').forEach(b => b.onclick = async () => {
    const r = await api(`/api/entities/${b.dataset.run}/run`, {method:'POST', body:{input:{demo:true}}});
    openDialog(`<h3>Test run #${r.run_id} created</h3>
      <p class="sub">Live tab will show the events; logs persist to the database.</p>
      <div class="dlg-actions"><button class="btn" data-close>Close</button></div>`);
  });
  $$('[data-hist]').forEach(b => b.onclick = async () => {
    const runs = await api(`/api/runs?entity_id=${b.dataset.hist}`);
    openDialog(`<h3>Run history (${runs.length})</h3>
      ${runs.length ? `<table style="width:100%;font-size:13px;border-collapse:collapse">
        <tr style="text-align:left;color:var(--text-dim);font-weight:500"><th>id</th><th>trigger</th><th>status</th><th>started</th></tr>
        ${runs.map(r => `<tr style="border-top:1px solid var(--border)"><td style="padding:4px 0">${r.id}</td><td>${r.trigger}</td><td>${statusChip(r.status)}</td><td>${fmtRelative(r.started_at)}</td></tr>`).join('')}

// ============ SESSIONS (real Claude Code) ============
async function renderSessions() {
  const sessions = await api('/api/sessions');
  const now = Date.now();
  const groups = {active: [], today: [], week: [], older: []};
  for (const s of sessions) {
    const age = (now - new Date(s.mtime).getTime()) / 1000;
    if (age < 300) groups.active.push(s);
    else if (age < 86400) groups.today.push(s);
    else if (age < 604800) groups.week.push(s);
    else groups.older.push(s);
  }

  main.innerHTML = `
    <div class="banner">
      <b>Sessions are persisted to disk.</b> <code>/exit</code> does NOT delete them — Claude Code keeps the
      full transcript at <code>~/.claude/projects/&lt;encoded-path&gt;/&lt;uuid&gt;.jsonl</code>.
      The auto-memory under <code>~/.claude/projects/&lt;path&gt;/memory/*.md</code> also persists
      across <code>/exit</code> and is reloaded next session. To clear, delete the files manually.
    </div>
    <div class="bar">
      <span class="stat"><span class="pulse" style="display:inline-block;vertical-align:middle;margin-right:6px"></span><b>${groups.active.length}</b> active</span>
      <span class="stat">·  <b>${groups.today.length}</b> today</span>
      <span class="stat">·  <b>${groups.week.length}</b> this week</span>
      <span class="stat">·  <b>${groups.older.length}</b> older</span>
      <span style="flex:1"></span>
      <button class="btn btn-sm" id="refresh">Refresh</button>
    </div>
    <div class="split">
      <div id="sess-list">
        ${sessionGroup('Active', groups.active, true)}
        ${sessionGroup('Today', groups.today)}
        ${sessionGroup('This week', groups.week)}
        ${sessionGroup('Older', groups.older)}
      </div>
      <div class="panel ${S.selSession ? '' : 'empty'}" id="sess-panel">
        ${S.selSession ? '' : 'Select a session to see its transcript.'}
      </div>
    </div>
  `;
  $('#refresh').onclick = renderSessions;
  $$('[data-open-session]').forEach(r => r.onclick = async () => {
    S.selSession = r.dataset.openSession;
    $$('.row').forEach(x => x.classList.toggle('selected', x === r));
    renderSessionDetail(r.dataset.openSession);
  });
  if (S.selSession) renderSessionDetail(S.selSession);
}

function sessionGroup(label, list, alwaysShow) {
  if (!list.length && !alwaysShow) return '';
  return `
    <div class="group-header"><h2>${label}</h2><span class="count">${list.length}</span></div>
    ${list.length ? list.map(s => sessionRow(s)).join('') : '<div class="empty-state">—</div>'}
  `;
}

function sessionRow(s) {
  const sel = S.selSession === s.path;
  const title = s.first_user
    ? s.first_user.replace(/\s+/g, ' ').slice(0, 80)
    : `(no user prompt) ${s.id.slice(0, 8)}`;
  const cwdShort = s.cwd ? s.cwd.replace(/^\/Users\/[^/]+/, '~') : '';
  const isActive = (Date.now() - new Date(s.mtime).getTime()) / 1000 < 300;
  return `<div class="row ${sel?'selected':''}" data-open-session="${escapeHtml(s.path)}">
    <span class="id">${s.id.slice(0,8)}</span>
    ${isActive ? '<span class="pulse" title="recently active"></span>' : ''}
    <div class="name">
      ${escapeHtml(title)}
      <div class="sub" style="margin-top:2px;font-weight:400">${escapeHtml(cwdShort)}</div>
    </div>
    <span class="meta">${s.message_count} msgs · ${fmtBytes(s.size)} · ${fmtRelative(s.mtime)}</span>

}

async function renderSessionDetail(path) {
  $('#sess-panel').classList.remove('empty');
  $('#sess-panel').innerHTML = `<div class="sub" style="padding:14px">Loading transcript…</div>`;
  const d = await api(`/api/sessions/x?path=${encodeURIComponent(path)}`);
  const m = d.meta;
  const counts = {};
  for (const x of d.messages) counts[x.type] = (counts[x.type] || 0) + 1;
  const cwdShort = m.cwd ? m.cwd.replace(/^\/Users\/[^/]+/, '~') : '—';

  // show first 30 + last 20 messages to avoid huge DOM
  const MAX_HEAD = 30, MAX_TAIL = 20;
  let display = d.messages;
  let collapsed = 0;
  if (display.length > MAX_HEAD + MAX_TAIL + 5) {
    collapsed = display.length - MAX_HEAD - MAX_TAIL;
    display = [...display.slice(0, MAX_HEAD),
               {type: '__gap__', n: collapsed},
               ...display.slice(-MAX_TAIL)];
  }

  $('#sess-panel').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <h3 style="font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:13px">${m.id.slice(0,8)}…</h3>
      <span class="spacer" style="flex:1"></span>
      <a class="btn btn-sm" href="${escapeHtml('file://' + m.path)}" target="_blank">Open jsonl</a>
    </div>
    <dl class="kv">
      <dt>cwd</dt><dd><code>${escapeHtml(cwdShort)}</code></dd>
      <dt>messages</dt><dd>${m.message_count}</dd>
      <dt>started</dt><dd>${m.first_ts ? new Date(m.first_ts).toLocaleString() : '—'}</dd>
      <dt>last active</dt><dd>${fmtRelative(m.mtime)}</dd>
      <dt>file size</dt><dd>${fmtBytes(m.size)}</dd>
      <dt>types</dt><dd>${Object.entries(counts).map(([k,v])=>`<span class="chip">${escapeHtml(k)} · ${v}</span>`).join(' ')}</dd>
    </dl>
    <hr>
    <h3 style="font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em">Transcript</h3>
    ${display.map(x => msgBlock(x)).join('')}
  `;
}

function msgBlock(x) {
  if (x.type === '__gap__') {
    return `<div class="msg meta">… ${x.n} messages collapsed …</div>`;
  }
  if (x.type === 'user' || x.type === 'assistant') {
    const role = x.role || x.type;
    return `<div class="msg ${role==='user'?'user':'assistant'}">
      <div class="label">${escapeHtml(role)} · ${x.time ? fmtTime(x.time) : ''}</div>
      <div class="text">${escapeHtml(x.text || '')}</div>
    </div>`;
  }
  if (x.type === 'system') {
    return `<div class="msg system"><div class="label">system · ${x.time?fmtTime(x.time):''}</div><div class="text">${escapeHtml(x.text || '')}</div></div>`;
  }
  return `<div class="msg meta">${escapeHtml(x.type)} · ${x.time?fmtTime(x.time):''} · ${escapeHtml(x.text || '')}</div>`;
}

// ============ LIVE ============
async function renderLive() {
  main.innerHTML = `
    <div class="bar">
      <span class="chip" id="conn">connecting…</span>
      <span class="stat">·  <b id="ev-count">0</b> events streamed</span>
      <span class="stat">·  <b id="pending-count">0</b> pending decisions</span>
      <span style="flex:1"></span>
      <button class="btn btn-sm" id="clear">Clear feed</button>
    </div>
    <div class="feed" id="feed"><div class="feed-empty">Waiting for events from <code>/api/stream</code>…</div></div>
  `;
  if (es) es.close();
  es = new EventSource('/api/stream');
  let evCount = 0, pendingCount = 0, firstEv = true;
  const feed = $('#feed');

  es.onopen  = () => { $('#conn').textContent = '● live'; $('#conn').className = 'chip ok'; };
  es.onerror = () => { $('#conn').textContent = '○ disconnected'; $('#conn').className = 'chip bad'; };
  $('#clear').onclick = () => { feed.innerHTML = `<div class="feed-empty">Cleared.</div>`; firstEv = true; evCount = 0; $('#ev-count').textContent = 0; };

  function addEv(raw) {
    const d = JSON.parse(raw);
    if (firstEv) { feed.innerHTML = ''; firstEv = false; }
    const p = JSON.parse(d.payload);
    const isPendingPerm = d.kind === 'permission_request' && p.decision === 'pending';
    if (isPendingPerm) { pendingCount++; $('#pending-count').textContent = pendingCount; }
    const row = document.createElement('div');
    row.className = 'ev';
    row.innerHTML = `
      <span class="t">${fmtTime(d.created_at)}</span>
      <span>${kindChip(d.kind)}${levelChip(d.level)}</span>
      <div class="body">${d.entity_name?`<span class="sub">${kindChip(d.entity_kind||'')} ${escapeHtml(d.entity_name)}</span> · `:''}${describeEvent(d.kind, p)}</div>
      <div class="actions">${isPendingPerm ? decisionButtons(d.id) : ''}</div>
      <details><summary>raw</summary><pre class="mono">${escapeHtml(JSON.stringify(p, null, 2))}</pre></details>
    `;
    feed.prepend(row);
    evCount++; $('#ev-count').textContent = evCount;
    row.querySelectorAll('[data-decide]').forEach(b => b.onclick = async () => {
      await api(`/api/events/${b.dataset.decide}/decide`, {method:'POST', body:{decision: b.dataset.d}});
      row.querySelector('.actions').innerHTML = `<span class="chip ok">decided · ${b.dataset.d}</span>`;
      pendingCount = Math.max(0, pendingCount - 1); $('#pending-count').textContent = pendingCount;
    });
  }
  function addRun(raw) {
    const d = JSON.parse(raw);
    if (firstEv) { feed.innerHTML = ''; firstEv = false; }
    const row = document.createElement('div');
    row.className = 'ev';
    row.innerHTML = `
      <span class="t">${fmtTime(d.started_at)}</span>
      <span>${kindChip('run')}</span>
      <div class="body"><b>${escapeHtml(d.entity_name||'?')}</b> <span class="sub">${kindChip(d.entity_kind||'')}</span> · ${statusChip(d.status)} · trigger: ${d.trigger}</div>
      <div class="actions"></div>
    `;
    feed.prepend(row);
    evCount++; $('#ev-count').textContent = evCount;
  }
  es.addEventListener('event', e => addEv(e.data));
  es.addEventListener('run', e => addRun(e.data));
}

function decisionButtons(evid) {
  return ['allow_once','allow_session','allow_long','deny'].map(d =>
    `<button class="btn btn-sm ${d==='deny'?'bad':'primary'}" data-decide="${evid}" data-d="${d}">${d.replace('_',' ')}</button>`
  ).join('');
}

function describeEvent(kind, p) {
  if (kind === 'permission_request')
    return `<b>${escapeHtml(p.type||'?')}</b> → <span class="mono">${escapeHtml(String(p.target||'').slice(0,80))}</span> <span class="muted">· ${escapeHtml(p.decision||'pending')}</span>`;
  if (kind === 'resource_access') {
    const k = p.kind || p.tool || '?';
    const target = p.cmd || p.path || p.host || p.target || JSON.stringify(p.input||'') || '';
    return `<b>${escapeHtml(k)}</b> <span class="mono">${escapeHtml(String(target).slice(0,90))}</span> <span class="muted">${p.allowed===false?'· blocked':''}</span>`;
  }
  if (kind === 'artifact')
    return `<b>${escapeHtml(p.type||'file')}</b> ${escapeHtml(p.name||'')} <span class="muted">· ${p.size||0} bytes</span>`;
  if (kind === 'log')
    return `<span>${escapeHtml(p.msg || JSON.stringify(p))}</span>`;
  return `<code>${escapeHtml(JSON.stringify(p).slice(0,160))}</code>`;
}

// ============ dispatch ============
function render() {
  if (es && cur !== 'live') { es.close(); es = null; }
  if (cur === 'plugins')  renderEntities('plugin');
  else if (cur === 'skills') renderEntities('skill');
  else if (cur === 'hooks')  renderEntities('hook');
  else if (cur === 'sessions') renderSessions();
  else if (cur === 'memory')   renderMemory();
  else if (cur === 'live')     renderLive();
  else if (cur === 'settings') renderSettings();
}
render();
